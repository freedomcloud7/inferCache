# Prometheus scrape configuration for InferCache

scrape_configs:
  - job_name: "infercache-gateway"
    scrape_interval: 15s
    static_configs:
      - targets: ["gateway:8080"]
    metrics_path: /metrics

  - job_name: "litellm"
    scrape_interval: 15s
    static_configs:
      - targets: ["litellm:4000"]
    metrics_path: /metrics

  - job_name: "redis"
    scrape_interval: 30s
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "postgres"
    scrape_interval: 30s
    static_configs:
      - targets: ["postgres-exporter:9187"]
